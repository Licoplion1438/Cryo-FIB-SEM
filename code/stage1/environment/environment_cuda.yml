# Stage-1 reproducibility environment, Linux x86_64 / NVIDIA GPU.
# Validated on NVIDIA RTX 4090 D with PyTorch 2.4.1+cu121.
# Environment installation, CUDA forward/backward, and 2 training epochs passed.
# Full CUDA training to convergence has not been validated.
name: cryo-fib-sem-stage1
channels:
  - conda-forge
dependencies:
  - python=3.8.20
  - pip
  - numpy=1.24.4
  - scipy=1.10.1
  - tifffile=2023.7.10
  - imagecodecs=2023.1.23
  - matplotlib=3.7.3
  - pandas=2.0.3
  - tqdm=4.67.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - opencv-python-headless==4.8.0.76
      - torch==2.4.1+cu121
