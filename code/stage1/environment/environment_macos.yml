# Stage-1 reproducibility environment, macOS (Apple Silicon MPS).
# Reconstructed from the tested FIB-SEM Conda snapshot.
# The PyTorch build comes from the Conda pytorch channel.
name: cryo-fib-sem-stage1
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8.20
  - pip
  - pytorch=2.4.1
  - numpy=1.24.4
  - scipy=1.10.1
  - opencv=4.8.0
  - tifffile=2023.7.10
  - imagecodecs=2023.1.23
  - matplotlib=3.7.3
  - pandas=2.0.3
  - tqdm=4.67.1
